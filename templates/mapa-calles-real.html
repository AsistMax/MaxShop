<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NODO Mapa Calles Real</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>body{margin:0} #map{width:100vw;height:100vh}</style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [-65.824, -28.469], // Catamarca
  zoom: 13
});
map.addControl(new maplibregl.NavigationControl());

// Carga pins reales desde Supabase /tracking
fetch('/tracking/ruta/TEST123').then(r=>r.json()).then(d=>{
  d.puntos?.forEach(p=>{
    new maplibregl.Marker().setLngLat([p.lng, p.lat]).addTo(map);
  })
});
</script>
</body>
</html>
