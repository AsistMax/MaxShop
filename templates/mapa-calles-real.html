<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODO - Mapa Real Dinámico</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; color:#e5e5e5; font-family: Inter, system-ui, sans-serif; padding:20px; }
        h1 { font-size:22px; margin-bottom:6px; letter-spacing:-0.5px; }
        .sub { color:#888; font-size:13px; margin-bottom:18px; }
        #map { height:420px; border-radius:18px; border:1px solid #222; background:#111; z-index:1; }
        .status { margin-top:14px; padding:12px 14px; background:#141414; border:1px solid #222; border-radius:12px; font-size:13px; color:#aaa; display:flex; justify-content:space-between; align-items:center; }
        .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; margin-right:6px; box-shadow:0 0 8px #22c55e; }
        .tareas { margin-top:16px; display:grid; gap:10px; }
        .card { background:#141414; border:1px solid #222; border-radius:12px; padding:12px 14px; }
        .card b { color:#fff; }
        .badge { font-size:11px; padding:3px 8px; border-radius:20px; background:#1e1e1e; border:1px solid #333; }
    </style>
</head>
<body>
    <h1>NODO - Mapa Real Dinámico</h1>
    <p class="sub">Detecta tu ubicación real y carga nodos cercanos. Fallback inteligente a Buenos Aires.</p>

    <div id="map"></div>

    <div class="status" id="status">
        <span><span class="dot"></span><span id="status-text">Detectando ubicación...</span></span>
        <span class="badge" id="region-badge">-</span>
    </div>

    <div class="tareas" id="tareas-list"></div>

<script>
let mapa = null;
let capaMarkers = null;

function crearMapa(lat, lng, region) {
    // Limpia mapa previo si existe (evita bug de tiles duplicados)
    if (mapa) {
        mapa.remove();
        mapa = null;
    }

    mapa = L.map('map').setView([lat, lng], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
    }).addTo(mapa);

    capaMarkers = L.layerGroup().addTo(mapa);

    // Marker tu ubicación
    const iconUser = L.divIcon({
        html: '<div style="width:18px;height:18px;background:#fff;border:3px solid #22c55e;border-radius:50%;box-shadow:0 0 12px #22c55e"></div>',
        className: '',
        iconSize: [18,18]
    });
    L.marker([lat, lng], {icon: iconUser}).addTo(capaMarkers)
        .bindPopup('<b>Tu ubicación</b><br>' + region + '<br>' + lat.toFixed(4) + ', ' + lng.toFixed(4)).openPopup();

    // Carga tareas dinámicas
    fetch('/api/tareas?region=' + encodeURIComponent(region) + '&lat=' + lat + '&lng=' + lng)
        .then(r => r.json())
        .then(data => {
            document.getElementById('region-badge').innerText = data.region_final;
            document.getElementById('status-text').innerText = 'Nodos en ' + data.region_final + ' (' + data.total + ') - lat:' + lat.toFixed(3) + ' lng:' + lng.toFixed(3);
            
            const lista = document.getElementById('tareas-list');
            lista.innerHTML = '';
            data.tareas.forEach(t => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = '<div style="display:flex;justify-content:space-between"><b>' + t.titulo + '</b><span class="badge">' + t.tipo + '</span></div><div style="margin-top:6px;color:#888;font-size:12px">' + t.direccion + ' - $' + t.pago + '</div>';
                lista.appendChild(card);

                L.marker([t.lat, t.lng]).addTo(capaMarkers)
                    .bindPopup('<b>' + t.titulo + '</b><br>' + t.direccion);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('status-text').innerText = 'Error cargando nodos';
        });
}

function detectarUbicacion() {
    const statusText = document.getElementById('status-text');
    
    if (!navigator.geolocation) {
        statusText.innerText = 'Geolocalización no soportada - Usando Buenos Aires';
        crearMapa(-34.6118, -58.3960, 'Buenos Aires');
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            
            // Detecta region con mismos rangos del backend
            let region = 'Buenos Aires'; // default
            if (lat >= -35.2 && lat <= -34.3 && lng >= -58.7 && lng <= -58.2) {
                region = 'Buenos Aires';
            } else if (lat >= -32.0 && lat <= -30.0 && lng >= -65.0 && lng <= -63.0) {
                region = 'Córdoba';
            } else if (lat >= -29.0 && lat <= -27.0 && lng >= -66.5 && lng <= -65.0) {
                region = 'Catamarca';
            } else {
                // Si está fuera de zonas conocidas, usa la más cercana por lat
                if (lat < -31) region = 'Buenos Aires';
                else if (lat < -28.5) region = 'Córdoba';
                else region = 'Catamarca';
            }

            crearMapa(lat, lng, region);
        },
        (err) => {
            console.warn('Geo error:', err.message);
            statusText.innerText = 'Permiso denegado / Error - Fallback Buenos Aires';
            crearMapa(-34.6118, -58.3960, 'Buenos Aires');
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
}

// Auto start
document.addEventListener('DOMContentLoaded', detectarUbicacion);
</script>
</body>
</html>
