<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODO - Mapa Real</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Manrope,sans-serif;background:#f5f5ff}
#map{height:420px;width:100%;border-radius:18px;border:2px solid #e6e6ff}
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = null;
var userMarker = null;

function crearMapa(lat, lng, region) {
  if(map) map.remove();
  map = L.map('map').setView([lat, lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  
  // Tu ubicación
  userMarker = L.marker([lat, lng]).addTo(map).bindPopup(`Estás en ${region}`).openPopup();
  
  // Tareas cercanas según región
  fetch(`/api/tareas?region=${region}&lat=${lat}&lng=${lng}`)
    .then(r=>r.json()).then(data=>{
      data.tareas.forEach(t=>{
        L.marker([t.lat, t.lng]).addTo(map)
          .bindPopup(`${t.title}<br>${t.loc}<br>${t.price}`);
      });
    });
}

function detectarUbicacion() {
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      let lat = pos.coords.latitude;
      let lng = pos.coords.longitude;
      
      // Detectar región según coordenadas
      let region = "Catamarca";
      if(lat > -35.2 && lat < -34.3 && lng > -58.7 && lng < -58.2) region = "Buenos Aires";
      else if(lat > -32 && lat < -30 && lng > -65 && lng < -63) region = "Córdoba";
      else if(lat > -29 && lat < -27 && lng > -66.5 && lng < -65) region = "Catamarca";
      else region = "Buenos Aires"; // Default CABA si no está en Catamarca/Córdoba
      
      crearMapa(lat, lng, region);
    }, ()=>{
      // Si no da permiso, muestra Buenos Aires por defecto, no Catamarca
      crearMapa(-34.6118, -58.3960, "Buenos Aires");
    });
  } else {
    crearMapa(-34.6118, -58.3960, "Buenos Aires");
  }
}

detectarUbicacion();
</script>
</body>
</html>
