<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODO Mapa Real</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;font-family:system-ui;background:#0A0A0A;color:#fff}#map{height:100vh}.top{position:absolute;top:12px;left:12px;z-index:999;background:#141414;border:1px solid #262626;border-radius:16px;padding:12px 16px}</style></head><body><div class="top">NODO MAPA VIVO REAL - <span id="info">TEST123</span></div><div id="map"></div><script>const API="https://maxshop-api.onrender.com";const envio=new URLSearchParams(location.search).get("envio")||"TEST123";const map=L.map('map').setView([-28.4696,-65.7852],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let poly=null;async function cargar(){const r=await fetch(`${API}/tracking/ruta/${envio}`);const d=await r.json();if(!d.puntos.length)return;const ll=d.puntos.map(p=>[p.lat,p.lng]);if(poly)map.removeLayer(poly);poly=L.polyline(ll,{color:'#FF6B0A',weight:4}).addTo(map);map.fitBounds(ll);document.getElementById('info').textContent=envio+" • "+d.puntos.length+" puntos"};cargar();setInterval(cargar,3000);</script></body></html>
