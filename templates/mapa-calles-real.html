<!DOCTYPE html><html lang=es><head><meta charset=UTF-8><meta name=viewport content="width=device-width><title>NODO - Mapa Real Dinámico</title><link rel=stylesheet href=https://unpkg.com/leaflet@1.9.4/dist/leaflet.css><script src=https://unpkg.com/leaflet@1.9.4/dist/leaflet.js></script><style>body{margin:0;font-family:sans-serif}#map{height:420px;width:100%;border-radius:18px;border:2px solid #e6e6ff;margin:16px;width:calc(100% - 32px)}.info{padding:16px}</style></head><body><div class=info><h3>NODO - Mapa Real por Ubicación</h3><p id=status>Detectando ubicación...</p></div><div id=map></div><script>
var map=null;
function crearMapa(lat,lng,region){
 if(map) map.remove();
 map=L.map('map').setView([lat,lng],13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 L.marker([lat,lng]).addTo(map).bindPopup('Estás en '+region).openPopup();
 document.getElementById('status').innerText='Mostrando: '+region+' ('+lat.toFixed(4)+', '+lng.toFixed(4)+') - Tareas reales de tu zona';
 fetch('/api/tareas?region='+region+'&lat='+lat+'&lng='+lng).then(r=>r.json()).then(d=>{
   d.tareas.forEach(t=>{L.marker([t.lat,t.lng]).addTo(map).bindPopup(t.title+'<br>'+t.loc+'<br>'+t.price)});
 });
}
function detectarUbicacion(){
 if(navigator.geolocation){
   navigator.geolocation.getCurrentPosition(pos=>{
     let lat=pos.coords.latitude, lng=pos.coords.longitude;
     let region='Buenos Aires';
     if(lat>-35.2 && lat<-34.3 && lng>-58.7 && lng<-58.2) region='Buenos Aires';
     else if(lat>-29 && lat<-27 && lng>-66.5 && lng<-65) region='Catamarca';
     else if(lat>-32 && lat<-30 && lng>-65 && lng<-63) region='Córdoba';
     crearMapa(lat,lng,region);
   }, err=>{
     crearMapa(-34.6118,-58.3960,'Buenos Aires');
   });
 } else {
   crearMapa(-34.6118,-58.3960,'Buenos Aires');
 }
}
detectarUbicacion();
</script></body></html>
