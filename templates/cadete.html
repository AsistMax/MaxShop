<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadete REAL</title><style>body{font-family:system-ui;background:#0A0A0A;color:#fff;padding:20px;max-width:480px;margin:auto}input{width:100%;padding:12px;border-radius:12px;border:1px solid #262626;background:#141414;color:#fff;margin:6px 0}button{width:100%;padding:16px;border-radius:999px;border:0;font-weight:700;margin:8px 0}.green{background:#22C55E;color:#000}.blue{background:#3B82F6;color:#fff}.card{background:#141414;border:1px solid #262626;border-radius:16px;padding:16px;margin-top:12px}</style></head><body><h2>📦 NODO Cadete REAL</h2><input id="envio" value="TEST123"><input id="cadete" value="CADETE_MAX"><button class="green" onclick="iniciar()">▶️ INICIAR - GPS REAL</button><button class="blue" onclick="completar()">✅ COMPLETADO + BORRAR CHAT</button><div class="card"><div id="status">Esperando...</div><div id="log"></div></div><script>let watch=null;const API="https://maxshop-api.onrender.com";async function iniciar(){const envio_id=envio.value,cadete_id=cadete.value;await fetch(`${API}/tracking/estado`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({envio_id,estado:'en_camino',cadete_id})});watch=setInterval(()=>navigator.geolocation.getCurrentPosition(pos=>{fetch(`${API}/tracking/ping`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({envio_id,cadete_id,lat:pos.coords.latitude,lng:pos.coords.longitude})}).then(r=>r.json()).then(j=>{status.innerText=`📍 ${pos.coords.latitude.toFixed(6)} - ${j.ok?'OK':''}`})} ),3000)}async function completar(){await fetch(`${API}/tracking/estado`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({envio_id:envio.value,estado:'completado',cadete_id:cadete.value})});if(watch)clearInterval(watch);status.innerText="✅ COMPLETADO - Chat borrado"}</script></body></html>
