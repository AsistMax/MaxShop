<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxShop Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;color:#fff}
.header{background:#000;padding:15px;border-bottom:1px solid #222;display:flex;align-items:center;gap:15px;position:sticky;top:0;z-index:100}
.logo-img{width:45px;height:45px;border-radius:10px;object-fit:cover;background:#fff}
.banner{width:100%;height:280px;object-fit:cover;position:relative}
.banner-wrap{position:relative}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);display:flex;align-items:end;padding:30px}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}
.card{background:#18181b;border:1px solid #27272a;border-radius:16px;overflow:hidden;transition:0.2s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:#facc15}
.card-banner{width:100%;height:160px;object-fit:cover;background:#222}
.card-body{padding:16px}
.badge{background:#facc15;color:#000;padding:4px 10px;border-radius:20px;font-weight:900;font-size:12px}
.btn{width:100%;background:#facc15;color:#000;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:10px}
.btn:hover{background:#fde047}
.input{width:100%;background:#18181b;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
.modal.active{display:flex}
.modal-box{background:#18181b;border-radius:20px;max-width:600px;width:100%;max-height:90vh;overflow:auto}
.m-banner{width:100%;height:220px;object-fit:cover}
.tabs{display:flex;gap:10px;margin:20px 0}
.tab{padding:10px 20px;border-radius:10px;background:#222;border:none;color:#fff;cursor:pointer}
.tab.active{background:#facc15;color:#000}
</style>
</head>
<body>
<div class="header">
<img src="https://drive.google.com/thumbnail?id=1J5QqJcVvX5z5QJqJ5QqJcVvX5z5QJqJ5Qq&sz=w200" onerror="this.src='https://via.placeholder.com/100x100?text=MAX'" class="logo-img" id="siteLogo">
<div><b style="font-size:18px">MaxShop</b><br><small style="color:#facc15">ENTERPRISE</small></div>
<div style="margin-left:auto;display:flex;gap:10px">
<button class="tab" onclick="document.getElementById('modalReg').classList.add('active')">+ Comercio</button>
<button class="tab active" onclick="location.reload()">Inicio</button>
</div>
</div>

<div class="banner-wrap">
<img id="siteBanner" class="banner" src="https://drive.google.com/thumbnail?id=1J5QqJcVvX5z5QJqJ5QqJcVvX5z5QJqJ5Qq&sz=w1000" onerror="this.src='https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200'" >
<div class="banner-overlay"><div><h1 style="font-size:42px;font-weight:900">MaxShop Enterprise</h1><p style="color:#ddd;margin-top:8px">Descuentos reales en Catamarca. 20% a 50% OFF según tu plan.</p></div></div>
</div>

<div class="container">
<div class="tabs">
<button class="tab active" onclick="filtrar('todos')">Todos</button>
<button class="tab" onclick="filtrar('gastronomia')">Gastronomía</button>
<button class="tab" onclick="filtrar('indumentaria')">Indumentaria</button>
<button class="tab" onclick="filtrar('servicios')">Servicios</button>
</div>
<div id="grid" class="grid"><p style="color:#666">Cargando comercios...</p></div>
</div>

<!-- MODAL DETALLE -->
<div id="modalDetalle" class="modal" onclick="if(event.target==this)this.classList.remove('active')">
<div class="modal-box">
<img id="mBanner" class="m-banner">
<div style="padding:20px">
<div style="display:flex;align-items:center;gap:12px"><img id="mLogo" style="width:60px;height:60px;border-radius:12px;object-fit:cover;background:#fff"><div><h2 id="mNombre" style="font-weight:900"></h2><span id="mDescBadge" class="badge"></span></div></div>
<p id="mDesc" style="margin:15px 0;color:#ccc"></p>
<div style="background:#000;padding:15px;border-radius:12px;margin:10px 0">
<p>📍 <b id="mDir"></b></p>
<p>📞 <b id="mTel"></b></p>
<p>💰 Descuento: <b id="mPct" style="color:#facc15"></b></p>
</div>
<a id="mWsp" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none">WhatsAppear al comercio</a>
<button onclick="document.getElementById('modalDetalle').classList.remove('active')" style="background:#222;color:#fff;width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px">Cerrar</button>
</div>
</div>
</div>

<!-- MODAL REGISTRO COMERCIO -->
<div id="modalReg" class="modal" onclick="if(event.target==this)this.classList.remove('active')">
<div class="modal-box" style="padding:20px">
<h2>Registrar mi comercio</h2>
<input id="f_nombre" class="input" placeholder="Nombre Fantasía">
<input id="f_rubro" class="input" placeholder="Rubro (gastronomia, indumentaria...)">
<input id="f_dir" class="input" placeholder="Dirección">
<input id="f_tel" class="input" placeholder="Tel / WhatsApp">
<input id="f_pct" class="input" type="number" placeholder="% Descuento (ej: 25)">
<textarea id="f_desc" class="input" placeholder="Descripción de la promo"></textarea>
<label style="font-size:12px;color:#888">Logo del comercio</label>
<input id="f_logo" type="file" class="input" accept="image/*">
<label style="font-size:12px;color:#888">Banner / Portada</label>
<input id="f_banner" type="file" class="input" accept="image/*">
<button id="btnGuardar" class="btn" onclick="guardarComercio()">Guardar Comercio</button>
<button onclick="document.getElementById('modalReg').classList.remove('active')" style="background:#222;color:#fff;width:100%;padding:10px;border-radius:10px;border:none;margin-top:10px">Cancelar</button>
</div>
</div>

<script>
let comercios=[]
async function cargar(){
try{
const r=await fetch('/api/comercios'); const j=await r.json(); comercios=j.data||[];
render(comercios)
}catch(e){document.getElementById('grid').innerHTML='<p>Error: '+e+'</p>'}
}
function render(lista){
if(!lista.length){document.getElementById('grid').innerHTML='<p style="color:#666">Aún no hay comercios. ¡Sé el primero en registrarte!</p>'; return}
document.getElementById('grid').innerHTML=lista.map(c=>`
<div class="card" onclick='abrirDetalle(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
<img class="card-banner" src="${c.banner_url||c.imagen_url||'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=500'}" onerror="this.src='https://via.placeholder.com/400x200?text=Sin+Imagen'">
<div class="card-body">
<div style="display:flex;gap:10px;align-items:center"><img src="${c.logo_url||'https://via.placeholder.com/100'}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;background:#fff" onerror="this.style.display='none'"><b>${c.nombre_fantasias||c.nombre||'Comercio'}</b></div>
<p style="color:#888;font-size:13px;margin:8px 0">${(c.descripcion||'').slice(0,80)}</p>
<span class="badge">${c.porcentaje_descuento||20}% OFF</span>
<button class="btn">Ver descuento →</button>
</div>
</div>`).join('')
}
function abrirDetalle(c){
if(typeof c==='string') c=JSON.parse(c)
document.getElementById('mBanner').src=c.banner_url||c.imagen_url||'https://via.placeholder.com/600x300'
document.getElementById('mLogo').src=c.logo_url||'https://via.placeholder.com/100'
document.getElementById('mNombre').innerText=c.nombre_fantasias||c.nombre
document.getElementById('mDescBadge').innerText=(c.porcentaje_descuento||20)+'% DESCUENTO'
document.getElementById('mDesc').innerText=c.descripcion||'Promo exclusiva MaxShop'
document.getElementById('mDir').innerText=c.direccion||'Consultar dirección'
document.getElementById('mTel').innerText=c.telefono||c.whatsapp||'-'
document.getElementById('mPct').innerText=(c.porcentaje_descuento||20)+'% OFF con MaxShop'
document.getElementById('mWsp').href='https://wa.me/'+(c.whatsapp||c.telefono||'').replace(/[^0-9]/g,'')
document.getElementById('modalDetalle').classList.add('active')
}
function filtrar(cat){
if(cat==='todos') render(comercios)
else render(comercios.filter(c=>(c.rubro||'').toLowerCase().includes(cat)))
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
}
async function subir(file){
if(!file) return null
const fd=new FormData(); fd.append('file',file)
const r=await fetch('/api/upload',{method:'POST',body:fd}); const j=await r.json()
return j.url
}
async function guardarComercio(){
const btn=document.getElementById('btnGuardar'); btn.innerText='Subiendo...'; btn.disabled=true
try{
let logoUrl=null, bannerUrl=null
if(document.getElementById('f_logo').files[0]) logoUrl=await subir(document.getElementById('f_logo').files[0])
if(document.getElementById('f_banner').files[0]) bannerUrl=await subir(document.getElementById('f_banner').files[0])
const data={
nombre_fantasias: document.getElementById('f_nombre').value,
rubro: document.getElementById('f_rubro').value,
direccion: document.getElementById('f_dir').value,
telefono: document.getElementById('f_tel').value,
whatsapp: document.getElementById('f_tel').value,
porcentaje_descuento: parseInt(document.getElementById('f_pct').value)||20,
descripcion: document.getElementById('f_desc').value,
logo_url: logoUrl,
banner_url: bannerUrl,
imagen_url: bannerUrl
}
const r=await fetch('/api/registrar-comercio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
const j=await r.json()
if(j.success){alert('¡Comercio registrado!'); document.getElementById('modalReg').classList.remove('active'); cargar()}
else alert('Error: '+JSON.stringify(j))
}catch(e){alert('Error '+e)}
btn.innerText='Guardar Comercio'; btn.disabled=false
}
cargar()
</script>
</body>
                                                       </html>
