<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaxShop 365 - Firebase</title>
<style>
*{box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
.logo{height:40px}.credit-pill{background:#facc15;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold;display:none}
.tab{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;margin:4px;cursor:pointer}.tab.active{background:#facc15;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;padding:10px;overflow-y:auto}
.modal.active{display:flex}.modal-box{background:#1a1a1a;border:1px solid #facc15;border-radius:16px;width:100%;max-width:440px;padding:18px}
.input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
.btn{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0;background:#facc15;color:#000;font-weight:bold;cursor:pointer}
.btn-dark{background:#222;color:#fff}
</style>
</head>
<body>
<div class="header">
<img id="logoMain" class="logo"><div><span id="creditPill" class="credit-pill"></span><button class="btn-dark" style="padding:8px 12px;border-radius:8px;border:0" onclick="document.getElementById('sideMenu').classList.add('active')">☰</button></div>
</div>
<div style="padding:10px;text-align:center"><img id="bannerMain" style="width:100%;border-radius:14px"><h2>MaxShop 365 - Oficial Firebase</h2><p id="creditText" style="color:#facc15">Ingresa para ver tu crédito</p>
<div style="background:#111;border-left:4px solid #facc15;padding:12px;margin:12px 0;border-radius:8px;font-size:12px;text-align:left">✅ Ahora con Firebase: tu cuenta vale en PC, celu y tablet. Si olvidas clave, recuperas por mail oficial de Google + WhatsApp.</div>
<div id="filtros" style="display:flex;flex-wrap:wrap;justify-content:center"><button class="tab active">TODOS</button></div>
<div id="grid" class="grid"></div>
<div id="ruletaSection" style="display:none;text-align:center;padding:16px;background:#111;margin:10px;border-radius:14px"><h3 style="color:#facc15">Ruleta</h3><button class="btn" onclick="girarRuleta()">GIRAR</button><p id="resRuleta"></p></div>
</div>

<div id="sideMenu" class="modal" style="justify-content:flex-end;background:rgba(0,0,0,.6)"><div class="modal-box" style="height:100%;border-radius:0;max-width:280px"><h3>Menú</h3><button class="btn btn-dark" onclick="side('login')">Ingresar</button><button class="btn btn-dark" onclick="side('registro')">Registro Gratis $20000</button><button class="btn btn-dark" onclick="side('pro')">Ser PRO $5000</button><button class="btn btn-dark" onclick="side('recupero')">Recuperar clave</button><button class="btn" onclick="document.getElementById('sideMenu').classList.remove('active')">Cerrar</button></div></div>

<div id="mAuth" class="modal"><div class="modal-box"><h2 id="tAuth">Auth</h2>
<div id="bLogin"><input id="l_mail" class="input" placeholder="Correo"><input id="l_pass" type="password" class="input" placeholder="Clave"><button class="btn" onclick="loginFirebase()">Ingresar</button><p style="text-align:center"><a href="#" onclick="openRecupero()" style="color:#facc15">¿Olvidaste tu clave? Recuperar</a></p><button class="btn btn-dark" onclick="openRegistro()">Crear cuenta gratis</button><p id="resLogin"></p></div>
<div id="bReg" style="display:none"><input id="r_nom" class="input" placeholder="Nombre *"><input id="r_dni" class="input" placeholder="DNI *"><input id="r_wsp" class="input" placeholder="WhatsApp 549... *"><input id="r_mail" class="input" placeholder="Correo *"><input id="r_pass" type="password" class="input" placeholder="Clave *"><button class="btn" onclick="registroFirebase()">Crear cuenta en Firebase</button><p id="resReg"></p></div>
<button onclick="closeM('mAuth')" class="btn btn-dark">Volver</button></div></div>

<div id="mRecupero" class="modal"><div class="modal-box"><h2>Recuperar 🔐</h2><input id="rec_mail" class="input" placeholder="Tu correo registrado"><button class="btn" onclick="recuperarFirebase()">Enviar mail de recupero + ver datos</button><div id="recResultado" style="display:none;background:#000;padding:12px;border-radius:12px;margin-top:10px;border:1px dashed #facc15"></div><button onclick="closeM('mRecupero')" class="btn btn-dark">Volver</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQwyhq9ctYbE69ETD8szD7WTP-dBnA7Cs",
  authDomain: "maxshop365-c45e0.firebaseapp.com",
  projectId: "maxshop365-c45e0",
  storageBucket: "maxshop365-c45e0.firebasestorage.app",
  messagingSenderId: "1872812990",
  appId: "1:1872812990:web:33f2c59cc38b7306bb77ef",
  measurementId: "G-9TJ0NPEBHD"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const LOGO_URL="https://drive.google.com/thumbnail?id=1LnhE76WKVNtDGY7w2s0I_Y2zyzB150Ib&sz=w200";
const BANNER_URL="https://drive.google.com/thumbnail?id=1M7-vHb8XMAVgecZdlYe9UBo9SH_mDoEI&sz=w1000";

document.getElementById('logoMain').src=LOGO_URL;
document.getElementById('bannerMain').src=BANNER_URL;
document.getElementById('grid').innerHTML='<div class="card"><h3>Demo Comercio</h3><p>10% OFF</p></div>';

window.closeM=(id)=>document.getElementById(id).classList.remove('active');
window.side=(a)=>{document.getElementById('sideMenu').classList.remove('active');setTimeout(()=>{if(a==='login'){document.getElementById('mAuth').classList.add('active');document.getElementById('bLogin').style.display='block';document.getElementById('bReg').style.display='none'} if(a==='registro'){openRegistro()} if(a==='recupero'){openRecupero()}},150)}
window.openRegistro=()=>{document.getElementById('mAuth').classList.add('active');document.getElementById('bLogin').style.display='none';document.getElementById('bReg').style.display='block';}
window.openRecupero=()=>{document.getElementById('mAuth').classList.remove('active');document.getElementById('sideMenu').classList.remove('active');document.getElementById('mRecupero').classList.add('active')}

window.registroFirebase=async()=>{
  const nombre=document.getElementById('r_nom').value, dni=document.getElementById('r_dni').value, wsp=document.getElementById('r_wsp').value, mail=document.getElementById('r_mail').value, pass=document.getElementById('r_pass').value;
  if(!nombre||!dni||!mail||!pass){document.getElementById('resReg').innerText='Completa *';return}
  try{
    const cred=await createUserWithEmailAndPassword(auth, mail, pass);
    await addDoc(collection(db, "usuarios"), { uid: cred.user.uid, nombre, dni, wsp, mail: mail.toLowerCase(), credito: 20000, plan: "FREE", creado: new Date() });
    document.getElementById('resReg').innerText='✅ Creado en Firebase! Ya podes ingresar en cualquier dispositivo';
    setTimeout(()=>{closeM('mAuth'); location.reload()},1200);
  }catch(e){document.getElementById('resReg').innerText='Error: '+e.message}
}

window.loginFirebase=async()=>{
  const mail=document.getElementById('l_mail').value, pass=document.getElementById('l_pass').value;
  try{
    const cred=await signInWithEmailAndPassword(auth, mail, pass);
    const q=query(collection(db, "usuarios"), where("uid", "==", cred.user.uid));
    const snap=await getDocs(q);
    if(!snap.empty){let u=snap.docs[0].data(); localStorage.setItem('maxshop_user', JSON.stringify(u)); document.getElementById('creditText').innerText=u.nombre+' - $'+u.credito; document.getElementById('creditPill').innerText='$'+u.credito; document.getElementById('creditPill').style.display='inline-block'; document.getElementById('ruletaSection').style.display='block';}
    closeM('mAuth'); document.getElementById('resLogin').innerText='Ingresado!';
  }catch(e){document.getElementById('resLogin').innerText='Clave mal o no existe. Usa Recuperar';}
}

window.recuperarFirebase=async()=>{
  const mail=document.getElementById('rec_mail').value.toLowerCase().trim();
  if(!mail){return}
  const box=document.getElementById('recResultado'); box.style.display='block'; box.innerHTML='Buscando...';
  try{
    // 1. Busca datos extra en firestore
    const q=query(collection(db, "usuarios"), where("mail", "==", mail));
    const snap=await getDocs(q);
    if(snap.empty){box.innerHTML='❌ No existe ese correo en Firebase. Registrate de nuevo.'; return}
    let u=snap.docs[0].data();
    // 2. Envia mail oficial de Google
    await sendPasswordResetEmail(auth, mail);
    box.innerHTML=`✅ Cuenta encontrada:<br>Nombre: ${u.nombre}<br>DNI: ${u.dni}<br>WSP: ${u.wsp}<br>Mail: ${u.mail}<br><br>📧 <b>Te enviamos un mail oficial de Google para cambiar la clave</b> (revisa spam).<br><br><button class="btn" onclick="window.open('https://wa.me/${u.wsp.replace(/\\D/g,'')}?text=MaxShop:%20recuperaste%20tu%20cuenta%20${u.mail}','_blank')">Avisar por WhatsApp</button>`;
  }catch(e){box.innerHTML='Error: '+e.message}
}

window.girarRuleta=()=>{document.getElementById('resRuleta').innerText='Ganaste $500 demo';}

// Auto-login si ya hay sesion firebase
auth.onAuthStateChanged(async(user)=>{
  if(user){
    const q=query(collection(db, "usuarios"), where("uid", "==", user.uid));
    const snap=await getDocs(q);
    if(!snap.empty){let u=snap.docs[0].data(); document.getElementById('creditText').innerText=u.nombre+' - $'+u.credito; document.getElementById('creditPill').innerText='$'+u.credito; document.getElementById('creditPill').style.display='inline-block'; document.getElementById('ruletaSection').style.display='block';}
  }
});
</script>
</body>
</html>
