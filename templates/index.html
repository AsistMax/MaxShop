<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet"><style>body{font-family:Inter;background:#080C14;color:white}</style></head><body class="p-4">
<header class="flex items-center gap-3 border-b border-white/10 pb-4">
<img src="https://lh3.googleusercontent.com/d/1LnhE76WKVNtDGY7w2s0I_Y2zyzB150Ib" class="w-12 h-12 rounded-xl bg-white object-contain p-1">
<h1 class="text-xl font-black">MaxShop <span class="text-cyan-400">Enterprise</span></h1>
</header>
<img src="https://lh3.googleusercontent.com/d/1M7-vHb8XMAVgecZdlYe9UBo9SH_mDoEI" class="w-full h-56 object-cover rounded-2xl mt-4">
<div id="lista" class="grid grid-cols-2 gap-3 mt-6"></div>
<script>
fetch('/api/comercios').then(r=>r.json()).then(j=>{
 document.getElementById('lista').innerHTML=j.data.map(c=>`<div class="bg-white/5 p-3 rounded-xl border border-white/10"><img src="${c.logo_url||''}" class="w-full h-20 object-contain bg-white rounded"><p class="font-bold mt-2">${c.nombre_fantasias}</p><p class="text-cyan-400 text-sm">${c.porcentaje_descuento}% OFF - ${c.dia_promocion}</p></div>`).join('')
})
</script></body></html>
