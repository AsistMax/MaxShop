function normalizarWhatsapp(num){ if(!num) return ""; let n=num.toString().replace(/\D/g,""); n=n.replace(/^0+/,""); if(n.startsWith("549")) return n; if(n.startsWith("54")) return n.replace(/^54/,"549"); return "549"+n; }

function closeAllModals(){ document.querySelectorAll('.modal.active').forEach(m=>m.classList.remove('active')); document.getElementById('sideMenu').classList.remove('active'); }
