<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxShop Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:#fff}
.header{background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);padding:12px 20px;border-bottom:1px solid #222;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.logo-img{width:50px;height:50px;border-radius:12px;object-fit:cover;background:#fff;border:2px solid #facc15}
.banner-wrap{position:relative;height:340px;overflow:hidden;background:#111}
.banner{width:100%;height:100%;object-fit:cover}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(0deg,#0a0a0a 10%,rgba(0,0,0,0.1) 70%);display:flex;align-items:end;padding:30px}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;margin-top:20px}
.card{background:#18181b;border:1px solid #27272a;border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:#facc15;box-shadow:0 10px 30px rgba(250,204,21,.15)}
.card-banner{width:100%;height:170px;object-fit:cover;background:#222}
.card-body{padding:16px}
.badge{background:#facc15;color:#000;padding:5px 12px;border-radius:20px;font-weight:900;font-size:12px}
.btn{width:100%;background:#facc15;color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:12px}
.input{width:100%;background:#18181b;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
.modal.active{display:flex}
.modal-box{background:#18181b;border:1px solid #333;border-radius:20px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
.m-banner{width:100%;height:230px;object-fit:cover;background:#222}
.tab{padding:10px 18px;border-radius:10px;background:#222;border:none;color:#fff;cursor:pointer}
.tab.active{background:#facc15;color:#000}
.preview{width:100%;height:120px;object-fit:cover;border-radius:10px;margin:6px 0;display:none;background:#222}
</style>
</head>
<body>
<div class="header">
<img id="siteLogo" class="logo-img" src="https://drive.google.com/uc?export=view&id=1LnhE76WKVNtDGY7w2s0I_Y2zyzB150Ib">
<div><b style="font-size:19px">MaxShop</b><br><small style="color:#facc15;font-weight:800">ENTERPRISE</small></div>
<div style="margin-left:auto;display:flex;gap:8px">
<button class="tab" onclick="openReg()">+ Comercio</button>
<button class="tab active">Inicio</button>
</div>
</div>

<div class="banner-wrap">
<img id="siteBanner" class="banner" src="https://drive.google.com/uc?export=view&id=1M7-vHb8XMAVgecZdlYe9UBo9SH_mDoEI">
<div class="banner-overlay"><div><h1 style="font-size:44px;font-weight:900;line-height:.9">MaxShop Enterprise</h1><p style="color:#d4d4d8;margin-top:10px;max-width:600px">La red de descuentos más grande de Catamarca. Mostrá tu tarjeta y ahorrá 20% a 50%.</p><div style="margin-top:15px;display:flex;gap:10px"><span class="badge">+150 COMERCIOS</span><span class="badge" style="background:#fff">DESCUENTOS REALES</span></div></div></div>
</div>

<div class="container">
<div style="display:flex;gap:10px;margin:20px 0;flex-wrap:wrap">
<button class="tab active" onclick="filtrar('todos',this)">Todos</button>
<button class="tab" onclick="filtrar('gastronomia',this)">Gastronomía</button>
<button class="tab" onclick="filtrar('indumentaria',this)">Indumentaria</button>
<button class="tab" onclick="filtrar('servicios',this)">Servicios</button>
</div>
<div id="grid" class="grid"><p style="color:#666">Cargando comercios...</p></div>
</div>

<div id="modalDetalle" class="modal" onclick="if(event.target==this) this.classList.remove('active')">
<div class="modal-box">
<img id="mBanner" class="m-banner">
<div style="padding:22px">
<div style="display:flex;gap:14px;align-items:center"><img id="mLogo" style="width:64px;height:64px;border-radius:14px;object-fit:cover;background:#fff;border:2px solid #facc15"><div><h2 id="mNombre" style="font-weight:900;font-size:22px"></h2><div id="mDescBadge" class="badge" style="margin-top:6px"></div></div></div>
<p id="mDesc" style="margin:16px 0;color:#a1a1aa;line-height:1.5"></p>
<div style="background:#000;border:1px solid #27272a;padding:16px;border-radius:14px;display:grid;gap:8px">
<p>📍 <b id="mDir"></b></p>
<p>📞 <b id="mTel"></b></p>
<p>🏷️ <span id="mRubro" style="color:#facc15"></span> • <b id="mPct" style="color:#facc15"></b></p>
</div>
<a id="mWsp" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;font-size:16px">💬 Contactar por WhatsApp</a>
<a id="mMap" target="_blank" style="display:block;text-align:center;background:#222;color:#fff;padding:12px;border-radius:12px;margin-top:8px;text-decoration:none">📍 Ver en Maps</a>
<button onclick="document.getElementById('modalDetalle').classList.remove('active')" style="background:#222;color:#fff;width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px">Cerrar</button>
</div>
</div>
</div>

<div id="modalReg" class="modal" onclick="if(event.target==this) this.classList.remove('active')">
<div class="modal-box" style="padding:22px">
<h2 style="font-weight:900;margin-bottom:10px">Registrar mi comercio</h2>
<input id="f_nombre" class="input" placeholder="Nombre Fantasía *">
<input id="f_rubro" class="input" placeholder="Rubro: gastronomia, indumentaria, servicios...">
<input id="f_dir" class="input" placeholder="Dirección exacta *">
<input id="f_tel" class="input" placeholder="WhatsApp (ej: 3834123456) *">
<input id="f_pct" class="input" type="number" placeholder="% Descuento (ej: 25) *">
<textarea id="f_desc" class="input" placeholder="Describí la promo"></textarea>
<label style="font-size:12px;color:#888">Logo (desde tu galería)</label>
<input id="f_logo" type="file" class="input" accept="image/*" onchange="previewImg(this,'prevLogo')">
<img id="prevLogo" class="preview">
<label style="font-size:12px;color:#888">Banner / Foto del local (desde tu galería)</label>
<input id="f_banner" type="file" class="input" accept="image/*" onchange="previewImg(this,'prevBanner')">
<img id="prevBanner" class="preview">
<button id="btnGuardar" class="btn" onclick="guardarComercio()">Publicar Comercio</button>
<button onclick="document.getElementById('modalReg').classList.remove('active')" style="background:#222;color:#fff;width:100%;padding:10px;border-radius:10px;border:none;margin-top:10px">Cancelar</button>
</div>
</div>

<script>
const LOGO_URL="https://drive.google.com/uc?export=view&id=1LnhE76WKVNtDGY7w2s0I_Y2zyzB150Ib";
const BANNER_URL="https://drive.google.com/uc?export=view&id=1M7-vHb8XMAVgecZdlYe9UBo9SH_mDoEI";
function previewImg(input,id){const p=document.getElementById(id); if(input.files&&input.files[0]){p.style.display='block'; p.src=URL.createObjectURL(input.files[0])}}
let comercios=[]
async function cargar(){const r=await fetch('/api/comercios'); const j=await r.json(); comercios=j.data||[]; render(comercios)}
function render(lista){
if(!lista.length){document.getElementById('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:#666"><h3>Aún no hay comercios</h3><p>¡Sé el primero!</p></div>'; return}
document.getElementById('grid').innerHTML=lista.map(c=>{
const b=c.banner_url||c.imagen_url||BANNER_URL; const l=c.logo_url||LOGO_URL;
return `<div class="card" onclick='abrirDetalle(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
<img class="card-banner" src="${b}" onerror="this.src='${BANNER_URL}'">
<div class="card-body">
<div style="display:flex;gap:10px;align-items:center"><img src="${l}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;background:#fff" onerror="this.src='${LOGO_URL}'"><b>${c.nombre_fantasias||c.nombre||'Comercio'}</b></div>
<p style="color:#888;font-size:13px;margin:10px 0;height:36px;overflow:hidden">${(c.descripcion||'Promo exclusiva MaxShop').slice(0,90)}</p>
<div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">${c.porcentaje_descuento||20}% OFF</span><small style="color:#666">${c.rubro||''}</small></div>
<button class="btn">Ver descuento →</button>
</div></div>`
}).join('')
}
function abrirDetalle(c){if(typeof c==='string') try{c=JSON.parse(c)}catch(e){return}
document.getElementById('mBanner').src=c.banner_url||c.imagen_url||BANNER_URL;
document.getElementById('mLogo').src=c.logo_url||LOGO_URL;
document.getElementById('mNombre').innerText=c.nombre_fantasias||c.nombre;
document.getElementById('mDescBadge').innerText=(c.porcentaje_descuento||20)+'% DESCUENTO MAXSHOP';
document.getElementById('mDesc').innerText=c.descripcion||'Presentá tu credencial MaxShop y obtené tu descuento.';
document.getElementById('mDir').innerText=c.direccion||'Consultar';
document.getElementById('mTel').innerText=c.telefono||c.whatsapp||'-';
document.getElementById('mRubro').innerText=c.rubro||'Comercio adherido';
document.getElementById('mPct').innerText=(c.porcentaje_descuento||20)+'% OFF';
const tel=(c.whatsapp||c.telefono||'').replace(/[^0-9]/g,'');
document.getElementById('mWsp').href=tel?`https://wa.me/${tel}?text=Hola! Vi su promo en MaxShop`:'#';
document.getElementById('mMap').href=c.direccion?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.direccion)}`:'#';
document.getElementById('modalDetalle').classList.add('active');
}
function filtrar(cat,el){if(el){document.querySelectorAll('.container.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active')} if(cat==='todos') render(comercios); else render(comercios.filter(c=>(c.rubro||'').toLowerCase().includes(cat.toLowerCase())))}
function openReg(){document.getElementById('modalReg').classList.add('active')}
async function subir(file){if(!file) return null; const fd=new FormData(); fd.append('file',file); const r=await fetch('/api/upload',{method:'POST',body:fd}); const j=await r.json(); if(!j.success) throw new Error(j.error); return j.url}
async function guardarComercio(){
const b=document.getElementById('btnGuardar'); b.innerText='Subiendo imágenes desde tu celular...'; b.disabled=true
try{
let logoUrl=null, bannerUrl=null
if(document.getElementById('f_logo').files[0]) logoUrl=await subir(document.getElementById('f_logo').files[0])
if(document.getElementById('f_banner').files[0]) bannerUrl=await subir(document.getElementById('f_banner').files[0])
const data={nombre_fantasias:document.getElementById('f_nombre').value,rubro:document.getElementById('f_rubro').value.toLowerCase(),direccion:document.getElementById('f_dir').value,telefono:document.getElementById('f_tel').value,whatsapp:document.getElementById('f_tel').value,porcentaje_descuento:parseInt(document.getElementById('f_pct').value)||20,descripcion:document.getElementById('f_desc').value,logo_url:logoUrl,banner_url:bannerUrl,imagen_url:bannerUrl}
if(!data.nombre_fantasias||!data.direccion||!data.telefono) throw new Error('Completá nombre, dirección y WhatsApp')
const r=await fetch('/api/registrar-comercio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); const j=await r.json()
if(j.success){alert('¡Comercio publicado con imagen de tu celular!'); document.getElementById('modalReg').classList.remove('active'); cargar()} else throw new Error(JSON.stringify(j))
}catch(e){alert('Error: '+e.message)} b.innerText='Publicar Comercio'; b.disabled=false
}
cargar()
</script>
</body>
  </html>
